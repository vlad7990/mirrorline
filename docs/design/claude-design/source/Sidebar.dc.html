<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Inter+Tight:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#14171C}a:hover{color:#B83A18}
</style>
</helmet>
<nav aria-label="Main" style="box-sizing: border-box; width: 100%; height: 100%; min-height: 640px; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px; background: #FFFFFF; border-right: 1px solid #E6E4DD; font-family: Inter, system-ui, sans-serif; color: #14171C;">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; text-decoration: none; color: #14171C;">
<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16a10 10 0 1 1-4.2-8.1" fill="none" stroke="#FF5A36" stroke-width="3" stroke-linecap="round"></path><path d="M22.5 3.5l-0.6 4.6 4.6 0.4" fill="none" stroke="#FF5A36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-family: 'Inter Tight', Inter, sans-serif; font-size: 19px; font-weight: 700;">Mirrorline</span>
</a>
<button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 14px; padding: 6px 10px; border: 1px solid #E6E4DD; border-radius: 10px; background: #FAFAF7; text-align: left; font: 500 13px Inter, sans-serif; color: #14171C;">
<span style="width: 30px; height: 30px; border-radius: 8px; background: #12545A; color: #F3E9DC; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;">MT</span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;"><span style="font-weight: 600;">Maya Torres Coaching</span><span style="color: #5F6672; font-size: 12px;">Growth plan</span></span>
</button>
<sc-for list="{{items}}" as="item" hint-placeholder-count="8">
<a href="{{item.href}}" style="{{item.style}}">{{item.label}}</a>
</sc-for>
<div style="flex-grow: 1;"></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 10px; background: #FAFAF7; border: 1px solid #E6E4DD;">
<div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="color: #5F6672;">Posts this month</span><span style="font-weight: 600;">63 of 90</span></div>
<div style="height: 6px; border-radius: 999px; background: #E6E4DD;"><div style="width: 70%; height: 6px; border-radius: 999px; background: #FF5A36;"></div></div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Home","Upload","Trends","Calendar","Results","Agents","Brand kit","Settings"],"default":"Home"},"$preview":{"width":240,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Home';
    const base = 'display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; text-decoration: none;';
    const list = [
      { label: 'Home', href: 'S2-Home.dc.html' },
      { label: 'Upload', href: 'S3-Upload.dc.html' },
      { label: 'Trends', href: 'S4-Trends.dc.html' },
      { label: 'Calendar', href: 'S6-Calendar.dc.html' },
      { label: 'Results', href: 'S7-Results.dc.html' },
      { label: 'Agents', href: 'S8-Agents.dc.html' },
      { label: 'Brand kit', href: 'S9-BrandKit.dc.html' },
      { label: 'Settings', href: 'S10-Settings.dc.html' }
    ];
    const items = list.map((it) => ({
      ...it,
      style: base + (it.label === active
        ? ' background: #FFE8E1; color: #8F2C11; font-weight: 600;'
        : ' color: #3E444D; font-weight: 500;')
    }));
    return { items };
  }
}
</script>
</body>
</html>
