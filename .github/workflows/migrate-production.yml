# Migrations reach production **before** the code that needs them, and Vlad's
# click on *Run workflow* is the approval (docs/DECISIONS.md D93, D104).
#
# ==============================================================================
# Why this exists
# ==============================================================================
#
# Production tracks `main` (D85), so a merge deploys the app. Nothing deploys
# the schema it needs — migrations have been applied by hand — so the first
# migration an app change depends on would put new code in front of an old
# schema, in production, with no warning.
#
# ==============================================================================
# Why it is a manual dispatch rather than a gated job on push
# ==============================================================================
#
# The first version ran on push to `main` and held the apply step behind a
# GitHub **Environment** with Vlad as a required reviewer. **That gate cannot
# exist on this repository** (D104): environment protection rules — required
# reviewers among them — are available on private repositories only on
# Enterprise, and on Free a private repository has no environments at all. The
# `environment: production` line would have parsed, run, and waited for nobody.
#
# So the order is inverted instead, which needs no GitHub feature to be true:
#
#   1. Actions → **Migrate production** → *Run workflow*, with `ref` set to the
#      **pull request's branch**.
#   2. Confirm it went green.
#   3. Merge the pull request.
#
# The schema is already in place when the code arrives, and the thing that waits
# for a human is the human starting it. Merging is still the only thing that
# deploys, and it is still Vlad's (D85).
#
# **The rule that makes step 3 safe: a PR's migrations must not change after
# they have been applied.** Amending, rebasing or adding to them after a green
# run puts production in front of code that assumes otherwise — and applied
# history cannot be edited, only added to. Need a change? Add another migration
# and run this again.
#
# ==============================================================================
# Inert until you turn it on, and loudly rather than silently
# ==============================================================================
#
# Every job is behind `vars.PRODUCTION_MIGRATIONS_ENABLED == 'true'`, a
# repository *variable* rather than a secret, because it is a switch and not a
# credential. Until it is set, the `preflight` job runs and says exactly what is
# missing. **It does not skip quietly**: a disabled safety gate that looks green
# is the thing this repo keeps finding bugs about.
#
# ==============================================================================
# What you set up once, and why none of it is in this file
# ==============================================================================
#
# Three repository secrets, and they do different jobs:
#
#   - `SUPABASE_PRODUCTION_ACCESS_TOKEN` — a **personal access token** from
#     supabase.com/dashboard/account/tokens, scoped to `mirrorline-production`.
#     `supabase link` uses the Management API and cannot authenticate without it.
#   - `SUPABASE_PRODUCTION_PROJECT_REF` — which project to link to.
#   - `SUPABASE_PRODUCTION_DB_PASSWORD` — the Postgres password `db push` uses.
#
# The token and the password are not interchangeable; one talks to the API and
# the other to the database. All three carry the `PRODUCTION_` prefix on purpose
# (D94): the token used to be called `SUPABASE_ACCESS_TOKEN` — the name the CLI
# reads out of the environment by default — and that convenience is the problem.
# An unprefixed name reads like one account-wide credential, while this workflow
# is the one place that must only ever reach `mirrorline-production`. It is
# still handed to the CLI *as* `SUPABASE_ACCESS_TOKEN` in the job's `env:`,
# because that is the variable the CLI reads; only the secret it is read from is
# production's.
#
# **No Vercel setting is needed any more.** The old condition 2 — turn off
# Vercel's production deploy, or add a deployment check that blocks promotion
# until this workflow passes — existed because the migration ran *after* the
# merge and could still be waiting while the code went live. Migrating before
# the merge removes that window, so the `promote` job and the
# `PROMOTE_FROM_WORKFLOW` switch are gone with it (D104).
#
# ==============================================================================
# The companion check
# ==============================================================================
#
# `production-schema-check.yml` runs on every push to `main` and fails if `main`
# carries a migration production does not have. That is what catches a merge
# which skipped step 1 — this workflow cannot, because nothing starts it
# automatically any more.
#
# The e2e suite must never be pointed at this project (D94). It creates real
# auth users and its teardown deletes `e2e+`-tagged accounts.

name: Migrate production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to migrate from — the PR branch, before you merge it'
        required: true
        default: main
        type: string

# A second run must not apply migrations while the first is mid-flight.
concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Is the gate configured?
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.PRODUCTION_MIGRATIONS_ENABLED }}
          HAS_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF != '' }}
          HAS_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD != '' }}
          HAS_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN != '' }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production migrations are not enabled::Set the repository variable PRODUCTION_MIGRATIONS_ENABLED=true and add SUPABASE_PRODUCTION_ACCESS_TOKEN, SUPABASE_PRODUCTION_PROJECT_REF and SUPABASE_PRODUCTION_DB_PASSWORD. Until then migrations are applied by hand and a merge can put new code in front of an old schema. See docs/DECISIONS.md D93 and D104."
            exit 0
          fi

          # Enabled but half-configured is the dangerous state: it looks armed
          # and is not. Fail rather than notice, and name every missing piece in
          # one go rather than one per re-run.
          missing=""
          [ "$HAS_ACCESS_TOKEN" = "true" ] || missing="$missing SUPABASE_PRODUCTION_ACCESS_TOKEN"
          [ "$HAS_REF" = "true" ] || missing="$missing SUPABASE_PRODUCTION_PROJECT_REF"
          [ "$HAS_PASSWORD" = "true" ] || missing="$missing SUPABASE_PRODUCTION_DB_PASSWORD"

          if [ -n "$missing" ]; then
            echo "::error title=Production migrations are enabled but not configured::PRODUCTION_MIGRATIONS_ENABLED is true but these secrets are missing:$missing"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

  # Expand/contract, checked on the ref being migrated rather than trusted from
  # the pull request's own CI run. The same gate `ci.yml` runs, pointed at
  # whatever was typed into the `ref` box — which is the tree about to reach
  # production.
  safety:
    name: Migrations are additive
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migration-safety

  migrate:
    name: Apply migrations
    needs: [preflight, safety]
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # Both credentials, and they are not interchangeable. `supabase link` talks
    # to the **Management API** and needs a personal access token; `db push`
    # connects to **Postgres** and needs the database password. Supplying only
    # the password gets a CLI that cannot link — a confusing failure a long way
    # from its cause.
    #
    # The left-hand names are what the CLI reads; the right-hand ones are the
    # secrets, both scoped to production (D94).
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Say what is being migrated, and from where
        run: |
          {
            echo "### Migrating production"
            echo
            echo "- ref: \`${{ inputs.ref }}\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- migrations in tree: $(ls -1 supabase/migrations/*.sql | wc -l | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Link
        run: supabase link --project-ref "${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}"

      - name: What production has now
        run: supabase migration list --linked

      # The dry run earns its place: it names exactly what the apply will do, in
      # the log, before anything is written — so a surprise (a migration nobody
      # expected, or none at all) is visible in the step above the one that acts
      # on it.
      - name: Dry run
        run: supabase db push --linked --dry-run

      # `--yes` is passed rather than relied upon. D94's near-miss was learning
      # that a closed stdin answers **Y** to `[Y/n]`, so omitting the flag in CI
      # is indistinguishable from passing it — and where the default is the
      # acting direction, the safe thing is to say it out loud.
      - name: Apply
        run: supabase db push --linked --yes

      - name: Confirm local and remote agree
        run: supabase migration list --linked
