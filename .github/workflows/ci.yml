name: CI

# Once per change, not twice.
#
# `push:` with no filter fired on every branch, so a branch with an open pull
# request ran the whole workflow twice for one commit — and both copies of the
# keyed `e2e` job create and delete accounts in the **one shared preview
# database** (D76). That is where the concurrency theory for #17's failure came
# from: two suites seeding and sweeping the same project genuinely do race, so
# it was a reasonable suspect, and it cost time to rule out as the cause of
# something else.
#
# `main` is still covered: a merge is a push to it, which is the run that says
# the merged result is sound. Everything else is covered by `pull_request`,
# which is how work lands here (CLAUDE.md #11). The one thing given up is CI on
# a branch with no pull request open yet — open a draft and it runs.
on:
  push:
    branches: [main]
  pull_request:
  # Added for D130's label path, and it is not a convenience.
  #
  # A merge made by `migrate-on-label.yml` runs as `GITHUB_TOKEN`, and GitHub
  # does not start workflows from events that token caused: "events triggered by
  # the GITHUB_TOKEN, **with the exception of `workflow_dispatch` and
  # `repository_dispatch`**, will not create a new workflow run." So the push to
  # `main` that a labelled merge produces starts nothing, and `main` would carry
  # a merge with no run of its own to vouch for it.
  #
  # The named exception is the way out: that workflow dispatches this one on
  # `main` after merging. Without this trigger the dispatch has nothing to call.
  workflow_dispatch:

# One run per branch, and the newest one wins (D124).
#
# Without this, every push to a branch with an open pull request started a fresh
# ~19-minute run while the superseded one carried on to the end. Nobody reads
# the result of a run against a commit that no longer exists, so it was pure
# spend — and the branch that found this had five pushes on it.
#
# **`main` is deliberately not cancelled.** A merge's run is the record that the
# merged result is sound, and two merges landing in quick succession would see
# the first record thrown away. Those queue instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No deploy job and no secrets: previews are promoted manually (CLAUDE.md #11).
jobs:
  # Is there anything executable in this change? (D124)
  #
  # A documentation commit used to cost the same ~19 billable minutes as a
  # refactor: twelve of them re-running 422 browser tests, three re-running the
  # Python suite, against bytes no interpreter will ever read. Two of the five
  # commits on the branch before this one were `docs(progress):`.
  #
  # **Every required check still runs and still reports.** `verify`, `e2e` and
  # `pipeline` are named in the `main` ruleset, so none of them may be skipped
  # at the job level — a skipped required check is a check that never arrives,
  # and auto-merge waits for it forever. They run; their expensive *steps* are
  # what this gate turns off.
  #
  # **Lint, typecheck, unit tests, the licence gate and migration safety run
  # regardless.** They cost 25 seconds together, and a cheap check that always
  # runs cannot be the one that was skipped on the day it mattered.
  #
  # Docs means `docs/**` or any `*.md`, and nothing else. `.github/workflows/`
  # is code — a change to this file has to prove itself. Verified before writing
  # it: no unit test and no page in the build reads anything under `docs/`; the
  # only code that touches the tree is the screenshot specs, which *write* into
  # it, and `scripts/mascot-assets.mjs`, which is run by hand.
  #
  # **The file list comes from git, not from the REST API, and that is a fix
  # rather than a preference.** The first version called
  # `gh api repos/.../pulls/N/files` and got `Resource not accessible by
  # integration (HTTP 403)` on its first real run: the default `GITHUB_TOKEN`
  # could not read that endpoint, even though the repository's default workflow
  # permission is `read`. The fail-safe below did its job — it ran everything
  # rather than going green over unbuilt code — so the gate was safe and
  # useless at the same time.
  #
  # Declaring `permissions: pull-requests: read` would probably have fixed it.
  # Git removes the dependency on token scopes altogether, which is the thing
  # that just failed, and the two SHAs it needs are already in the event
  # payload. `filter: blob:none` is what keeps it cheap: `git diff --name-only`
  # reads commits and trees, never file contents, so a blobless clone with full
  # history is both complete and small.
  #
  # **The polarity is deliberate, and it is the whole safety argument.** Every
  # condition downstream reads `!= 'false'`, never `== 'true'`, so the heavy
  # work runs unless this job *explicitly* said documentation-only. An output
  # that is empty — because the step died, the API refused, or somebody renamed
  # it — therefore spends the nineteen minutes we spend today. The opposite
  # polarity would turn the same accident into three green checks over code that
  # was never built or tested, which is the D116 mistake with a new hat on: if
  # absence is cheap and quiet, we have rebuilt the hole we just closed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, no file contents. `git diff --name-only` needs the
          # commits and their trees; the blobs are what make a deep clone slow.
          fetch-depth: 0
          filter: blob:none

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Nothing in here may exit non-zero. A failed gate would leave all
          # three required checks in `skipped` — never green, never red, and
          # auto-merge waiting on a verdict that is not coming.
          code() {
            echo "$1"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            # Three dots: what this branch changed, measured from where it left
            # the base. Two dots would also report everything that landed on
            # `main` since, reversed, and a busy afternoon on main would make
            # every documentation PR look like code.
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA") \
              || code "Could not diff $BASE_SHA...$HEAD_SHA; running everything."
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # A push to main. Two dots is right here: it is a linear range, and
            # for a merge commit it is exactly the pull request's own files.
            files=$(git diff --name-only "$BEFORE..$AFTER") \
              || code "Could not diff $BEFORE..$AFTER; running everything."
          else
            code "No base commit to compare against; running everything."
          fi

          [ -n "$files" ] || code "No changed files reported; running everything."

          executable=$(printf '%s\n' "$files" | grep -vE '^docs/|\.md$' || true)

          if [ -n "$executable" ]; then
            echo "Executable files in this change:"
            printf '%s\n' "$executable" | sed 's/^/  /'
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation only — the build, the browser suite and the"
            echo "Python suite are skipped. Changed files:"
            printf '%s\n' "$files" | sed 's/^/  /'
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7

      # pnpm must be installed before setup-node so its cache resolver works.
      # No `version:` here — the root package.json "packageManager" field pins
      # pnpm@9.15.4, and specifying it in both places is a hard error.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # 36 seconds, and nothing under `docs/` reaches a bundle (D124).
      - name: Build
        if: needs.changes.outputs.code != 'false'
        run: pnpm build

      - name: Licence check
        run: pnpm licence-check

      # Expand/contract (D93, D104). Production tracks main and migrations are
      # applied before the merge, so production runs the old code against the
      # new schema until the merge deploys — and a destructive migration would
      # leave it running one half of the change, with no way back. Checked here
      # on the branch, and again in migrate-production.yml on the ref being
      # migrated.
      - name: Migration safety
        run: pnpm migration-safety

  # Browser-level checks, which nothing above was doing (D111).
  #
  # `verify` builds the app but never opens it, so anything that breaks only in
  # a browser — a redirect, an axe violation, a route that renders nothing, a
  # server route that throws only in a production bundle — reached main
  # unchallenged and was found on somebody's laptop. This job is that gap.
  #
  # **Keyless on purpose.** playwright.config.ts forces ANTHROPIC_API_KEY empty
  # so the co-pilot answers in sample mode: no paid call (CLAUDE.md #11), and
  # assertions that do not depend on what a model said today. The production
  # build is the point rather than an accident — it is the artefact Vercel
  # serves, and `next dev` does not share its bundling.
  #
  # **No Supabase credentials, deliberately.** The suite creates and deletes
  # real accounts and workspaces, so pointing it at a project from CI is a
  # decision with consequences and pointing it at production would be a
  # destructive one. Without keys `auth.setup.ts` writes an empty storage state
  # and skips, `helpers/routes.ts` narrows the route table to what a signed-out
  # visitor can see, and the session-dependent specs are excluded by name in the
  # config. What remains is ~214 real tests across the marketing site, the
  # co-pilot, routing, accessibility and responsive behaviour.
  #
  # Not sharded. The whole job is about four minutes — roughly two and a half to
  # build, ninety seconds to run — so a matrix would add a build per shard to
  # save nothing.
  e2e:
    runs-on: ubuntu-latest
    needs: changes
    # The keyed suite is 422 browser tests and has taken 12m38s and 15m31s on
    # this runner, so 20 left under five minutes of head-room — and `retries: 1`
    # now adds a second attempt for anything that fails. 30 is not a fix for
    # anything; it is the cap being wider than the run it has to contain.
    timeout-minutes: 30
    # The job always runs so the required check always arrives; on a
    # documentation change every step below is a no-op (D124).
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - name: Nothing executable changed
        if: env.RUN != 'true'
        run: echo "Documentation only — see the \`changes\` job. No browser suite to run."

      - uses: actions/checkout@v7
        if: env.RUN == 'true'

      - uses: pnpm/action-setup@v6
        if: env.RUN == 'true'

      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: env.RUN == 'true'
        run: pnpm install --frozen-lockfile

      # Chromium only: every project in playwright.config.ts uses
      # `devices['Desktop Chrome']`, so the other browsers would be downloaded
      # and never launched.
      #
      # **Not cached, and that is the measurement rather than an oversight**
      # (D124). This step takes 19 seconds. Restoring ~150 MB of browser from
      # the Actions cache costs most of that on its own, and the cache still
      # cannot hold the apt half of `--with-deps`, so the recipe would have to
      # run `playwright install-deps` on a hit anyway. pnpm *is* cached, by
      # `setup-node` above, and it shows: installing the whole workspace takes
      # four seconds.
      - name: Install Playwright's browser
        if: env.RUN == 'true'
        run: pnpm exec playwright install --with-deps chromium

      # ======================================================================
      # The keys are preview's, and the job proves both halves of that
      # ======================================================================
      #
      # D116: this job ran keyless, so `playwright.config.ts` excluded
      # `SESSION_DEPENDENT_SPECS` — nineteen specs, every one of which drives
      # the studio. A run was ~214 passed and 241 skipped, and the skipped
      # half was the product. Two real defects sat behind it for days while CI
      # stayed green, one of them a calendar telling a client their empty week
      # was approved.
      #
      # Two checks, and the second is the one that is easy to leave out:
      #
      # 1. **Never production.** The suite creates and deletes users and
      #    workspaces. Pointed at production it would do that to real
      #    accounts, so a URL carrying the production ref stops the job dead
      #    rather than running against it.
      # 2. **Never silently keyless.** If a secret is renamed, unset, or
      #    unavailable to a fork, the config would quietly fall back to
      #    skipping the studio specs and the job would still go green — which
      #    is precisely the failure D116 is about. Absence has to be loud, or
      #    we rebuild the hole we just closed.
      #
      # No secret is echoed: the guard matches patterns and prints a verdict.
      - name: The keys are preview's, and they exist
        if: env.RUN == 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_REF: uvwedufzjldfahlqtisk
        run: |
          set -euo pipefail

          fail() { echo "::error title=Keyed e2e refused to run::$1"; exit 1; }

          [ -n "$SUPABASE_URL" ] || fail "NEXT_PUBLIC_SUPABASE_URL is empty. The suite would silently skip the nineteen studio specs and still pass - see docs/DECISIONS.md D116."
          [ -n "$SUPABASE_ANON_KEY" ] || fail "NEXT_PUBLIC_SUPABASE_ANON_KEY is empty."
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || fail "SUPABASE_SERVICE_ROLE_KEY is empty."

          case "$SUPABASE_URL" in
            *"$PRODUCTION_REF"*)
              fail "The URL carries the production project ref. This suite creates and deletes users and workspaces; it must only ever point at mirrorline-preview."
              ;;
          esac

          echo "Keys present, and the URL is not production."

      # `chromium` and `mobile` only. The `screenshots` project regenerates the
      # reference PNGs in docs/screens-built/ and takes twelve minutes to do it;
      # those are a deliberate, reviewed commit rather than something CI should
      # be producing. `setup` still runs, as their declared dependency.
      #
      # `E2E_ALLOW_NO_SUPABASE` is deliberately **not** set any more. It was
      # what let a keyless run be a pass; with keys it would only serve to let
      # a broken secret look like a green build.
      - name: End-to-end tests
        if: env.RUN == 'true'
        run: pnpm test:e2e --project=chromium --project=mobile
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Only on failure, and only what explains one: Playwright writes a trace
      # and a screenshot per failed test and nothing per passing one, so a green
      # run uploads nothing.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Engine v0. Its own job: a different language, a different toolchain, and
  # nothing in it depends on the web build passing first.
  pipeline:
    runs-on: ubuntu-latest
    needs: changes
    defaults:
      run:
        working-directory: services/pipeline
    # Same shape as `e2e`: the check always reports, and a documentation change
    # does not install a Python toolchain to prove a `.md` file compiles (D124).
    env:
      RUN: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - name: Nothing executable changed
        if: env.RUN != 'true'
        working-directory: .
        run: echo "Documentation only — see the \`changes\` job. No engine suite to run."

      - uses: actions/checkout@v7
        if: env.RUN == 'true'

      # The engine shells out to ffmpeg, and the tests generate their own test
      # footage with it. ubuntu-latest ships neither it nor a TTF that Pillow
      # can draw captions with, and the caption burner refuses rather than
      # falling back to an unreadable bitmap font.
      - name: Install ffmpeg and a caption font
        if: env.RUN == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      # Pinned to an exact tag, not a floating major: astral-sh stopped
      # publishing those after `v7`, so `@v10` does not resolve even though
      # v10.4.0 is the current release — "unable to find version `v10`", before
      # any step runs. The others here do publish majors.
      - uses: astral-sh/setup-uv@v10.4.0
        if: env.RUN == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/pipeline/uv.lock

      # --no-editable because this Python ignores the underscore-prefixed .pth
      # that hatchling's editable wheel writes (docs/DECISIONS.md D17).
      - name: Install
        if: env.RUN == 'true'
        run: uv sync --no-editable --dev

      # No model extras and no API key: the suite runs offline, and the Claude
      # finder is proved to refuse rather than proved to spend (CLAUDE.md #11).
      - name: Tests
        if: env.RUN == 'true'
        run: uv run --no-editable pytest -q
