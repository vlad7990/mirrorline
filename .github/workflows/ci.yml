name: CI

on:
  push:
  pull_request:

# No deploy job and no secrets: previews are promoted manually (CLAUDE.md #11).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its cache resolver works.
      # No `version:` here — the root package.json "packageManager" field pins
      # pnpm@9.15.4, and specifying it in both places is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Licence check
        run: pnpm licence-check
